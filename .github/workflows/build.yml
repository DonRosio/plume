# Builds plume.exe on GitHub's Windows servers.
#   - every push / pull request: checks (fmt, clippy, tests, dependency audit) + build;
#     the exe and its SHA-256 are downloadable from the run's "Artifacts".
#   - tag `v*` (e.g. v0.2.0): same, plus a GitHub Release (with a signed build-provenance
#     attestation when the repository is public).
#   - every Monday: dependency audit and secret scan only, so a vulnerability disclosed in an
#     existing dependency fails the run, and GitHub sends an e-mail, even when nobody pushes.
#
# Every third-party action is pinned to a full commit SHA (the comment gives the tag): a
# moved or hijacked tag cannot change what runs here.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "37 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    # The weekly run only audits: the code did not change.
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    permissions:
      contents: write # create the release (tags only)
      id-token: write # sign the attestation (tags only)
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # One command per step: in PowerShell a failing command in the middle of a multi-line
      # step would not fail the step.
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: SHA-256
        shell: pwsh
        run: |
          $hash = (Get-FileHash target/release/plume.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  plume.exe" | Out-File -Encoding ascii target/release/plume.exe.sha256
          Write-Host "SHA-256: $hash"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plume-${{ github.sha }}
          path: |
            target/release/plume.exe
            target/release/plume.exe.sha256
          if-no-files-found: error

      # GitHub only offers attestations for public repositories (or organisation plans): on a
      # private personal repo, integrity relies on the published SHA-256 instead.
      - if: startsWith(github.ref, 'refs/tags/v') && !github.event.repository.private
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: target/release/plume.exe

      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            target/release/plume.exe
            target/release/plume.exe.sha256

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2
        with:
          tool: cargo-audit
      # Checks Cargo.lock against the RustSec advisories.
      - run: cargo audit

  secrets:
    name: Secret scan (full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every commit, not only the last one: also catches a secret committed with
          # --no-verify, which skips the local pre-commit hook.
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        working-directory: ${{ runner.temp }}
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      # --redact: workflow logs are readable by anyone with access to the repository.
      - run: gitleaks git --config .gitleaks.toml --redact --verbose --no-banner
